<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/">🍰 Pastelería App</a>
  </div>

  <ul class="navbar-nav">
    <!-- Módulos para ADMINISTRADOR (3 features) -->
    <ng-container *ngIf="currentRole === 'ADMIN' || currentRole === 'ADMINISTRADOR' || currentRole === 'admin'">
      <li><a routerLink="/admin/dashboard" routerLinkActive="active">📊 Dashboard</a></li>
      <li><a routerLink="/admin/usuarios" routerLinkActive="active">👥 Usuarios</a></li>
      <li><a routerLink="/admin/catalogo" routerLinkActive="active">🎂 Catálogo</a></li>
    </ng-container>

    <!-- Módulos para PASTELERO (3 features) -->
    <ng-container *ngIf="currentRole === 'PASTELERO' || currentRole === 'pastelero'">
      <li><a routerLink="/pastelero/produccion" routerLinkActive="active">👨‍🍳 Producción</a></li>
      <li><a routerLink="/pastelero/inventario" routerLinkActive="active">📦 Inventario</a></li>
      <li><a routerLink="/pastelero/recetas" routerLinkActive="active">📖 Recetas</a></li>
    </ng-container>

    <!-- Módulos para CLIENTE (3 features) -->
    <ng-container *ngIf="currentRole === 'CLIENTE' || currentRole === 'cliente'">
      <li><a routerLink="/cliente/catalogo" routerLinkActive="active">🎂 Catálogo</a></li>
      <li><a routerLink="/cliente/pedidos" routerLinkActive="active">🛍️ Mis Pedidos</a></li>
      <li><a routerLink="/cliente/perfil" routerLinkActive="active">👤 Mi Perfil</a></li>
    </ng-container>
  </ul>

  <div class="navbar-user">
    <span class="role-badge">{{ currentRole }}</span>
    <button (click)="logout()" class="btn-logout">Cerrar Sesión</button>
  </div>
</nav>
