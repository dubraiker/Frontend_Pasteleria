<app-navbar></app-navbar>
<div class="container mt-4">
  <h2 class="mb-4">🍰 Catálogo de Pasteles y Postres</h2>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let item of productos">
      <div class="card h-100 shadow-sm border-0">
        <div class="card-body">
          <span class="badge bg-danger mb-2">{{ item.categoria }}</span>
          <h5 class="card-title">{{ item.nombre }}</h5>
          <p class="card-text text-muted">Stock disponible: {{ item.stock }} unidades</p>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="fw-bold text-danger fs-5">$ {{ item.precio }}</span>
            <button class="btn btn-outline-danger btn-sm">Agregar al Pedido</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
