<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card p-4 shadow-lg style-login" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <h2 class="text-danger">🎂 Pastelería App</h2>
      <p class="text-muted">Selecciona tu Rol para ingresar</p>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Seleccionar Rol</label>
        <select class="form-select" [(ngModel)]="selectedRole" name="role" required>
          <option value="Administrador">Administrador</option>
          <option value="Pastelero">Pastelero / Operativo</option>
          <option value="Cliente">Cliente</option>
        </select>
      </div>

      <button type="submit" class="btn btn-danger w-100 mt-2">Ingresar al Sistema</button>
    </form>
  </div>
</div>
